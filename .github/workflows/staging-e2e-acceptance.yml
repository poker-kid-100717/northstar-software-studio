name: Staging end-to-end acceptance
on:
  workflow_run:
    workflows: ['Deploy Northstar staging Preview']
    types: [completed]
  workflow_dispatch:
    inputs:
      complete_test_payment:
        description: 'Complete a hosted Stripe TEST card payment and verify the matching webhook and order'
        type: boolean
        required: true
        default: false
      require_stripe_checkout:
        description: 'Require real Stripe TEST checkout session creation (fails if staging checkout disabled)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
# The quote token is one-use. Never run two acceptance jobs against it in parallel.
concurrency:
  group: northstar-staging-acceptance
  cancel-in-progress: false
jobs:
  staging:
    name: ${{ matrix.mode == 'business' && 'Business + checkout acceptance' || 'Stripe TEST payment + webhook' }}
    if: >-
      github.repository == 'poker-kid-100717/northstar-software-studio' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [business, payment]
    runs-on: ubuntu-latest
    environment: northstar-staging
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Preflight isolated staging credentials
        env:
          NORTHSTAR_STAGING_URL: ${{ vars.NORTHSTAR_STAGING_URL }}
          STAGING_CF_ACCESS_JWT: ${{ secrets.STAGING_CF_ACCESS_JWT }}
          STAGING_TURNSTILE_TEST_TOKEN: ${{ secrets.STAGING_TURNSTILE_TEST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NORTHSTAR_STAGING_URL STAGING_CF_ACCESS_JWT STAGING_TURNSTILE_TEST_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing staging configuration::Required protected environment value $name is missing"
              exit 1
            fi
          done
          if [[ "$NORTHSTAR_STAGING_URL" != "https://staging.northstar-software-studio.pages.dev" ]]; then
            echo "::error::Refusing origin that is not a dedicated staging/preview HTTPS hostname"
            exit 1
          fi
          echo "Staging origin and required protected values present; values not printed."
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify staging Playwright tests parse and are discovered
        env:
          NORTHSTAR_STAGING_URL: ${{ vars.NORTHSTAR_STAGING_URL }}
          STAGING_CF_ACCESS_JWT: ${{ secrets.STAGING_CF_ACCESS_JWT }}
          STAGING_TURNSTILE_TEST_TOKEN: ${{ secrets.STAGING_TURNSTILE_TEST_TOKEN }}
        run: npx playwright test --config playwright.staging.config.ts --list
      - run: npx playwright install --with-deps chromium
        if: matrix.mode == 'business' || github.event_name == 'workflow_run' || inputs.complete_test_payment
      - name: Staging business acceptance (${{ matrix.mode }})
        if: matrix.mode == 'business' || github.event_name == 'workflow_run' || inputs.complete_test_payment
        env:
          NORTHSTAR_STAGING_URL: ${{ vars.NORTHSTAR_STAGING_URL }}
          STAGING_CF_ACCESS_JWT: ${{ secrets.STAGING_CF_ACCESS_JWT }}
          STAGING_TURNSTILE_TEST_TOKEN: ${{ secrets.STAGING_TURNSTILE_TEST_TOKEN }}
          STAGING_REQUIRE_STRIPE_CHECKOUT: ${{ matrix.mode == 'payment' || github.event_name == 'workflow_run' || inputs.require_stripe_checkout || inputs.complete_test_payment }}
          STAGING_COMPLETE_TEST_PAYMENT: ${{ matrix.mode == 'payment' }}
        run: npx playwright test --config playwright.staging.config.ts
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.mode == 'business' || github.event_name == 'workflow_run' || inputs.complete_test_payment)
        with:
          name: northstar-staging-${{ matrix.mode }}-report
          path: |
            web/staging-report/
            web/staging-results.xml
            web/test-results/
          retention-days: 7
          if-no-files-found: warn

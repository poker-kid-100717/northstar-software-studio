name: Protected production D1 migration
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply reviewed missing D1 migrations (false is read-only dry run)"
        type: boolean
        required: true
        default: false
      confirm_database_id:
        description: "For apply only, type the exact production D1 UUID"
        type: string
        required: false
        default: ""
permissions:
  contents: read
  actions: write
concurrency:
  group: northstar-production-d1-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: northstar-production-d1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preflight production-only scope and required protected credentials
        shell: bash
        env:
          CLOUD_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_D1_WRITE_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.NORTHSTAR_D1_BACKUP_PASSPHRASE }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm_database_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "poker-kid-100717/northstar-software-studio"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "$CLOUD_TOKEN" || { echo "::error::Missing protected secret PRODUCTION_CLOUDFLARE_D1_WRITE_TOKEN"; exit 1; }
          if [[ "$APPLY" == "true" ]]; then
            test "$CONFIRM" = "ef07d532-76a3-4a7e-bb1f-80fe4f021ec9" || { echo "::error::Exact production database confirmation required"; exit 1; }
            test -n "$BACKUP_PASSPHRASE" || { echo "::error::Missing protected secret NORTHSTAR_D1_BACKUP_PASSPHRASE"; exit 1; }
          fi
          echo "Scope confirmed. Mode: $([[ "$APPLY" == "true" ]] && echo apply || echo dry-run)."
      # npx Wrangler is resolved in the migration script; do not dirty the git checkout.
      - name: Read-only schema and database identity preflight
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_D1_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 961daf5c86645f2e06c6c86c6156db39
        run: ./scripts/Deploy-NorthstarD1.ps1
      - name: Create verified encrypted backup without migration
        if: inputs.apply
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_D1_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 961daf5c86645f2e06c6c86c6156db39
          GH_TOKEN: ${{ github.token }}
          NORTHSTAR_D1_BACKUP_PASSPHRASE: ${{ secrets.NORTHSTAR_D1_BACKUP_PASSPHRASE }}
        run: ./scripts/Deploy-NorthstarD1.ps1 -Apply -BackupOnly -RequireEncryptedBackup -ConfirmDatabaseId 'ef07d532-76a3-4a7e-bb1f-80fe4f021ec9' -BackupDirectory (Join-Path $env:RUNNER_TEMP 'northstar-d1-backup')
      - name: Durably store encrypted recovery backup before any D1 write
        if: inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: northstar-production-d1-encrypted-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/northstar-d1-backup/*.enc
          if-no-files-found: error
          retention-days: 30
      - name: Apply reviewed migrations only after backup artifact succeeds
        if: inputs.apply
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_D1_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 961daf5c86645f2e06c6c86c6156db39
          GH_TOKEN: ${{ github.token }}
          NORTHSTAR_D1_BACKUP_PASSPHRASE: ${{ secrets.NORTHSTAR_D1_BACKUP_PASSPHRASE }}
        run: ./scripts/Deploy-NorthstarD1.ps1 -Apply -RequireEncryptedBackup -ConfirmDatabaseId 'ef07d532-76a3-4a7e-bb1f-80fe4f021ec9' -BackupDirectory (Join-Path $env:RUNNER_TEMP 'northstar-d1-backup')
      - name: Remove any local backup artifacts
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/northstar-d1-backup"

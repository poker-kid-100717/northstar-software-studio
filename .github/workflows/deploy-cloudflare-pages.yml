name: Deploy storefront to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'functions/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production storefront
        run: npm run build -- --configuration production
      - name: Verify Angular deployment artifacts
        run: |
          set -eu
          test -s dist/northstar/browser/index.html
          echo 'Generated HTML:'
          head -c 500 dist/northstar/browser/index.html
          echo
          echo 'Deployment files:'
          find dist/northstar/browser -maxdepth 2 -type f | sort | head -50
          test "$(find dist/northstar/browser -maxdepth 1 -name 'main-*.js' | wc -l)" -gt 0
          echo 'Angular HTML and main JS bundle verified.'
      - name: Include Pages Functions in deployment
        run: |
          set -eu
          test -s ../functions/api/[[path]].ts
          mkdir -p dist/northstar/browser/functions/api
          cp '../functions/api/[[path]].ts' 'dist/northstar/browser/functions/api/[[path]].ts'
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist/northstar/browser --project-name=northstar-software-studio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

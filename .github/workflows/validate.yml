name: Validate Northstar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/storefront-catalog]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inquiry-browser:
    name: Inquiry desktop and mobile accessibility E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production storefront
        run: npm run build -- --configuration production
      - name: Verify inquiry flow on desktop and mobile
        run: npx playwright test
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inquiry-browser-diagnostics
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
  commerce-schema:
    name: Commerce D1 migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration constraints (SQLite)
        run: |
          python3 scripts/test-commerce-migration.py
          python3 scripts/test-commerce-notification.py
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Northstar.Api/Northstar.Api.csproj
      - name: Build
        run: dotnet build src/Northstar.Api/Northstar.Api.csproj --configuration Release --no-restore -warnaserror
  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: northstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Northstar: Host=localhost;Port=5432;Database=northstar_test;Username=northstar;Password=local_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute isolated PostgreSQL integration tests
        run: dotnet run --project tests/Northstar.IntegrationTests/Northstar.IntegrationTests.csproj --configuration Release
  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Parse and discover staging Playwright tests (no staging secrets)
        env:
          NORTHSTAR_STAGING_URL: https://staging.northstar-software-studio.pages.dev
          STAGING_CF_ACCESS_JWT: ci-discovery-placeholder
          STAGING_TURNSTILE_TEST_TOKEN: ci-discovery-placeholder
        run: npx playwright test --config playwright.staging.config.ts --list
      - name: Catalog parity check
        run: cd .. && node scripts/check-catalog-parity.mjs
      - name: Pages Functions type check
        run: npx tsc -p tsconfig.functions.json
      - name: Inquiry reliability and security tests
        run: node --test ../tests/inquiries.test.mjs
      - name: Production build
        run: npm run build -- --configuration production

name: Validate Northstar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/storefront-catalog]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Northstar.Api/Northstar.Api.csproj
      - name: Build
        run: dotnet build src/Northstar.Api/Northstar.Api.csproj --configuration Release --no-restore -warnaserror
  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build -- --configuration production

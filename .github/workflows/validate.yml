name: Validate Northstar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/storefront-catalog]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Northstar.Api/Northstar.Api.csproj
      - name: Build
        run: dotnet build src/Northstar.Api/Northstar.Api.csproj --configuration Release --no-restore -warnaserror
  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: northstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Northstar: Host=localhost;Port=5432;Database=northstar_test;Username=northstar;Password=local_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute isolated PostgreSQL integration tests
        run: dotnet run --project tests/Northstar.IntegrationTests/Northstar.IntegrationTests.csproj --configuration Release
  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Catalog parity check
        run: cd .. && node scripts/check-catalog-parity.mjs
      - name: Production build
        run: npm run build -- --configuration production
